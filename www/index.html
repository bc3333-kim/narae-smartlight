<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나래이엔지 스마트조명컨트롤러</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#0d0e11; --ink:#ece8e1; --ink-soft:#8b8f9a; --ink-dim:#5b5f6b; --line:#23262d; --chip:#16181d; --chip-line:#262a32;
    --ok:#62cfa0; --bad:#e0647a;
    --disc:#ffcf99; --disc-glow:rgba(255,190,110,.5); --amb:rgba(255,190,110,.5); --glow:0;
    font-size:16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); }
  body{
    color:var(--ink); min-height:100vh;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;
    letter-spacing:-0.01em; -webkit-font-smoothing:antialiased;
  }
  body::before{ /* 켜진 조명 색이 위쪽에서 번지는 주변광 */
    content:""; position:fixed; inset:0 0 auto 0; height:520px; pointer-events:none;
    background:radial-gradient(ellipse 70% 100% at 50% 0%, var(--amb), transparent 72%);
    opacity:calc(var(--glow) * .32); transition:opacity .6s;
  }
  .app{ position:relative; max-width:440px; margin:0 auto; padding:20px 24px 56px; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .company{ font-size:.6875rem; color:var(--ink-soft); margin:0 0 3px; }
  h1{ font-size:.9375rem; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .all-btn.ble{
    display:flex; align-items:center; gap:7px; border:1px solid var(--chip-line); background:transparent;
    color:var(--ink); border-radius:999px; padding:7px 13px; font:inherit; font-size:.75rem; font-weight:550; cursor:pointer;
  }
  .all-btn.ble svg{ width:12px; height:12px; }
  .all-btn.ble::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--ink-dim); order:-1; }
  .all-btn.ble.on::before{ background:var(--ok); box-shadow:0 0 8px var(--ok); }

  /* ---- 다이얼: 링=밝기, 중앙=전체 전원 ---- */
  .dial{ position:relative; width:230px; height:230px; margin:18px auto 4px; }
  .dial svg{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:pointer; overflow:visible; }
  .arc-track{ stroke:#20232a; }
  .arc-fill{ stroke:var(--disc); filter:drop-shadow(0 0 6px var(--disc-glow)); transition:stroke .4s; }
  .arc-knob{ fill:#fff; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .disc{
    position:absolute; left:50%; top:50%; width:140px; height:140px; margin:-70px 0 0 -70px; border-radius:50%; border:0; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:radial-gradient(circle at 50% 30%, #2a2d36 0%, #1b1d24 80%); color:var(--ink);
    box-shadow:0 0 0 1px #2c303a inset;
    transition:box-shadow .5s, background .5s, color .5s;
  }
  .disc.on{
    background:radial-gradient(circle at 50% 38%, #fff 0%, var(--disc) 78%); color:#16130e;
    box-shadow:0 0 calc(20px + 70px * var(--glow)) calc(2px + 14px * var(--glow)) var(--disc-glow);
  }
  .disc:active{ transform:scale(.98); }
  .disc:focus-visible{ outline:2px solid var(--ink); outline-offset:5px; }
  #brightVal{ font-size:2.1rem; font-weight:200; letter-spacing:-0.04em; line-height:1; font-variant-numeric:tabular-nums; }
  #allPowerLabel{ font-size:.75rem; font-weight:550; opacity:.7; }
  .auto-status{ min-height:1.1em; margin:12px 0 0; font-size:.75rem; color:var(--ink-soft); text-align:center; }
  .vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---- sections: 카드 없이 헤어라인으로만 구분 ---- */
  .sec{ margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .title, .section-label{ font-size:.8125rem; font-weight:600; color:var(--ink-soft); margin:0; }
  .section-label{ margin-bottom:6px; }
  .big{ font-size:1.5rem; font-weight:200; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .value{ font-size:.8125rem; font-weight:550; color:var(--ink); }

  .nm-slider{ position:relative; height:28px; }
  .nm-slider::before{ content:""; position:absolute; left:0; right:0; top:12px; height:4px; border-radius:99px; background:#22252c; }
  .nm-slider.ct::before{ background:linear-gradient(90deg,#ff9f45,#ffe9cf 50%,#a9d4ff); }
  .nm-track{ display:none; }
  .nm-slider input[type=range]{ -webkit-appearance:none; appearance:none; position:relative; z-index:2; width:100%; height:28px; margin:0; background:transparent; cursor:pointer; outline:none; }
  .nm-slider input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#f4f1ea; border:3px solid #0d0e11; box-shadow:0 0 0 1px #ffffff55, 0 4px 12px rgba(0,0,0,.6); }
  .nm-slider input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:#f4f1ea; border:3px solid #0d0e11; box-shadow:0 0 0 1px #ffffff55; }
  .nm-slider input[type=range]:focus-visible::-webkit-slider-thumb{ outline:2px solid #fff; outline-offset:3px; }
  .ct-labels{ display:flex; justify-content:space-between; margin-top:8px; font-size:.75rem; color:var(--ink-dim); }
  .ct-labels .dot{ display:none; }

  .quick-grid, .preset-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .quick-btn, .preset-btn{
    font:inherit; background:var(--chip); border:1px solid var(--chip-line); border-radius:16px; color:var(--ink);
    padding:14px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer;
    transition:border-color .2s, background .2s, transform .1s;
  }
  .quick-btn:active, .preset-btn:active{ transform:scale(.97); }
  .quick-btn:focus-visible, .preset-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .quick-glyph{ width:30px; height:30px; border-radius:50%; background:#20232a; display:flex; align-items:center; justify-content:center; transition:background .3s, box-shadow .3s; }
  .quick-glyph svg{ width:15px; height:15px; stroke:var(--ink-soft); }
  .quick-btn .qname{ font-size:.75rem; font-weight:550; color:var(--ink-soft); }
  .quick-btn.on{ border-color:color-mix(in srgb, var(--disc) 55%, transparent); }
  .quick-btn.on .qname{ color:var(--ink); }
  .quick-btn.on .quick-glyph{ background:var(--disc); box-shadow:0 0 16px var(--disc-glow); }
  .quick-btn.on .quick-glyph svg{ stroke:#16130e; }
  .quick-btn.offline{ opacity:.38; border-style:dashed; }

  .preset-btn{ gap:8px; padding:13px 2px 11px; }
  .sw{ width:16px; height:16px; border-radius:50%; box-shadow:0 0 0 1px #ffffff22 inset; }
  .preset-btn .pname{ font-size:.6875rem; font-weight:550; color:var(--ink-soft); }
  .timer-btn{ padding:15px 2px; }
  .timer-btn .pname{ font-size:.8125rem; color:var(--ink); }
  .timer-btn.active{ background:var(--disc); border-color:var(--disc); }
  .timer-btn.active .pname{ color:#16130e; font-weight:650; }
  .add-btn{ margin-top:10px; width:100%; border:0; background:none; font:inherit; font-size:.8125rem; font-weight:600; color:var(--bad); padding:8px; cursor:pointer; }

  .ind-row{ display:flex; align-items:center; justify-content:space-between; }
  .all-btn.ind-btn{
    font:inherit; display:flex; align-items:center; gap:8px; border:1px solid var(--chip-line); background:var(--chip); color:var(--ink);
    border-radius:999px; padding:9px 18px 9px 15px; cursor:pointer; font-size:.8125rem; font-weight:650; min-width:96px; justify-content:center;
  }
  .all-btn.ind-btn svg{ width:14px; height:14px; }
  .all-btn.ind-btn.lv1,.all-btn.ind-btn.lv2,.all-btn.ind-btn.lv3{ background:var(--disc); border-color:var(--disc); color:#16130e; }

  .follow-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); }
  #deviceList .follow-row:first-child{ border-top:0; }
  .follow-left{ display:flex; align-items:center; gap:13px; min-width:0; }
  .follow-bulb{ width:34px; height:34px; border-radius:50%; background:#1c1f25; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .follow-bulb svg{ width:15px; height:15px; stroke:var(--ink-dim); }
  .follow-bulb.ble-on{ background:#16322a; }
  .follow-bulb.ble-on svg{ stroke:var(--ok); }
  .follow-name .name{ font-size:.9375rem; font-weight:600; }
  .follow-name .name span{ font-size:.75rem; color:var(--ink-dim) !important; }
  .follow-name .meta{ display:flex; align-items:center; gap:6px; margin-top:3px; font-size:.75rem; color:var(--ink-soft); }
  .meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); }
  .meta .dot.on{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .ble-action-btn{ font:inherit; font-size:.8125rem; font-weight:600; padding:8px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .ble-action-btn.connect{ background:var(--ink); color:#0d0e11; border:1px solid var(--ink); }
  .ble-action-btn.disconnect{ background:transparent; color:var(--ink-soft); border:1px solid var(--chip-line); }
  .follow-right{ flex-shrink:0; }
  .empty{ text-align:center; padding:12px; color:var(--ink-soft); font-size:.8125rem; }

  .log{ margin:20px 0 0; font-size:.6875rem; color:var(--ink-dim); font-family:ui-monospace,monospace; max-height:80px; overflow:auto; }
  ::-webkit-scrollbar{ width:0; height:0; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<main class="app">

  <header class="top">
    <div>
      <p class="company">(주)나래이엔지</p>
      <h1>스마트조명컨트롤러</h1>
    </div>
    <button class="all-btn ble" id="bleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>
      <span id="bleLabel">블루투스</span>
    </button>
  </header>

  <p class="auto-status" id="autoStatus" role="status"></p>

  <div class="dial" id="dial">
    <svg viewBox="0 0 200 200" id="dialSvg" aria-hidden="true">
      <circle class="arc-track" cx="100" cy="100" r="92" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="433.5 578" transform="rotate(135 100 100)"/>
      <circle class="arc-fill" id="arcFill" cx="100" cy="100" r="92" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 578" transform="rotate(135 100 100)"/>
      <circle class="arc-knob" id="arcKnob" r="6.5" cx="100" cy="100"/>
    </svg>
    <button class="disc all-btn all-power" id="allPowerBtn" aria-label="전체 전원">
      <span id="brightVal">0%</span>
      <span id="allPowerLabel">전체 켜기</span>
    </button>
  </div>

  <section class="sec" style="margin-top:14px;border-top:0;padding-top:0">
    <div class="sec-head"><span class="title">전등</span></div>
    <div class="quick-grid" id="quickGrid"></div>
  </section>

  <div class="vh"><div id="brightTrackBg"></div><input type="range" id="brightSlider" min="5" max="100" value="5" aria-label="밝기" tabindex="-1"></div>

  <section class="sec">
    <div class="sec-head"><span class="title">색온도</span><span class="big"><span id="ctVal">5,250K</span></span></div>
    <div class="nm-slider ct">
      <div class="nm-track"></div>
      <input type="range" id="ctSlider" min="0" max="100" value="50" aria-label="색온도">
    </div>
    <div class="ct-labels"><span>전구색 3000K</span><span>주광색 6500K</span></div>
  </section>

  <section class="sec">
    <div class="sec-head"><span class="title">장면</span></div>
    <div class="preset-grid">
      <button class="preset-btn" onclick="window.__preset(100,0)"><span class="sw" style="background:#ffb066"></span><span class="pname">전구 100%</span></button>
      <button class="preset-btn" onclick="window.__preset(100,50)"><span class="sw" style="background:#fff0dc"></span><span class="pname">주백 100%</span></button>
      <button class="preset-btn" onclick="window.__preset(100,100)"><span class="sw" style="background:#bfe0ff"></span><span class="pname">주광 100%</span></button>
      <button class="preset-btn" onclick="window.__preset(50,50)"><span class="sw" style="background:#e8d5ba"></span><span class="pname">주백 50%</span></button>
    </div>
  </section>

  <section class="sec">
    <div class="ind-row">
      <span class="title">간접등</span>
      <button class="all-btn ind-btn" id="indBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        <span id="indLabel">OFF</span>
      </button>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><span class="title">꺼짐 타이머</span><span class="value" id="timerVal">사용 안 함</span></div>
    <div class="preset-grid">
      <button class="preset-btn timer-btn" id="timerBtn1" onclick="window.__setTimer(1,this)"><span class="pname">1분</span></button>
      <button class="preset-btn timer-btn" id="timerBtn10" onclick="window.__setTimer(10,this)"><span class="pname">10분</span></button>
      <button class="preset-btn timer-btn" id="timerBtn60" onclick="window.__setTimer(60,this)"><span class="pname">1시간</span></button>
      <button class="preset-btn timer-btn" id="timerBtn120" onclick="window.__setTimer(120,this)"><span class="pname">2시간</span></button>
    </div>
    <button class="add-btn" id="timerCancelBtn" style="display:none" onclick="window.__cancelTimer()">타이머 취소</button>
  </section>

  <section class="sec">
    <div class="section-label">블루투스 연결</div>
    <div id="deviceList"></div>
  </section>

  <div class="log" id="logBox" style="display:none;"></div>
</main>

<script src="ble-native.js"></script>
<script>
(function(){
  const state = {
    client:null, connected:false, topicBase:"home/light",
    master:{ brightness:0, ct:50 }
  };
  const $ = id => document.getElementById(id);
  const log = m => { const t=new Date().toLocaleTimeString('ko-KR',{hour12:false}); $('logBox').innerHTML = `[${t}] ${m}<br>`+$('logBox').innerHTML; };

  function bulbSvg(on){
    return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.4.3.6.8.6 1.3V16h6v-.9c0-.5.2-1 .6-1.3A6 6 0 0012 3z"/></svg>`;
  }
  function bleSvg(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg>`;
  }

  // ---------- mqtt (비활성화 - 브로커 연결 UI 제거됨) ----------

  function updateConnUI(){
    if($('connDot')) $('connDot').classList.toggle('on', state.connected);
    if($('connLabel')) $('connLabel').textContent = state.connected ? '브로커 연결됨' : '브로커 연결 안 됨 · 탭하여 설정';
    if(typeof renderQuick === 'function') renderQuick();
  }

  // ---------- 전등1~4 quick buttons ----------
  const quickLights = [
    { id:'L1', name:'전등1', power:false, connected:false },
    { id:'L2', name:'전등2', power:false, connected:false },
    { id:'L3', name:'전등3', power:false, connected:false },
    { id:'L4', name:'전등4', power:false, connected:false }
  ];

  // ---------- master (켜진 전등1~4 전체에 적용) ----------
  function publishMaster(){
    const payload = JSON.stringify({ power:true, brightness:state.master.brightness, ct:state.master.ct });
    const onLights = quickLights.filter(q=>q.power);
    if(state.client && state.connected) onLights.forEach(q=>state.client.publish(`${state.topicBase}/${q.id}/set`, payload, {qos:1}));
  }

  // BLE + MQTT 동시 전송 (슬라이더/프리셋용 — 연결된 전등 전체에 전송, ON/OFF 무관)
  function sendToAll(payload){
    publishMaster();
    quickLights.filter(q=>q.connected).forEach(q => bleSendTo(q.id, payload));
  }

  function ctToKelvin(v){
    const k = 3000 + (v/100) * (6500-3000);
    return Math.round(k).toLocaleString('en-US') + 'K';
  }

  function renderMaster(){
    $('brightVal').textContent = state.master.brightness + '%';
    $('brightSlider').value = state.master.brightness;
    $('brightTrackBg').style.width = state.master.brightness + '%';
    $('ctSlider').value = state.master.ct;
    $('ctVal').textContent = ctToKelvin(state.master.ct);
    updateHero();
  }
  function mixRgb(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
  function updateHero(){
    const on = quickLights.some(l => l.power);
    const v = Math.max(0, Math.min(100, state.master.brightness)), t = state.master.ct / 100;
    const warm=[255,168,86], mid=[255,236,212], cool=[176,215,255];
    const c = t < .5 ? mixRgb(warm, mid, t/.5) : mixRgb(mid, cool, (t-.5)/.5);
    const root = document.documentElement.style;
    root.setProperty('--disc', `rgb(${c})`);
    root.setProperty('--disc-glow', `rgba(${c},0.55)`);
    root.setProperty('--amb', `rgba(${c},0.9)`);
    root.setProperty('--glow', on ? (0.25 + 0.75*v/100).toFixed(2) : '0');
    const L = 433.5 * v / 100, ang = (135 + 270 * v / 100) * Math.PI / 180;
    const fill = $('arcFill'), knob = $('arcKnob');
    if (fill) { fill.setAttribute('stroke-dasharray', `${L} 578`); fill.style.opacity = on ? 1 : .35; }
    if (knob) { knob.setAttribute('cx', (100 + 92*Math.cos(ang)).toFixed(2)); knob.setAttribute('cy', (100 + 92*Math.sin(ang)).toFixed(2)); knob.style.opacity = on ? 1 : .5; }
  }


  $('brightSlider').oninput = function(){
    window.__lastAdjust = Date.now();
    state.master.brightness = Number(this.value);
    renderMaster();
    // power 필드 없이 전송 → 펌웨어가 현재 전원 상태 유지
    sendToAll({ brightness: state.master.brightness, ct: state.master.ct });
  };
  $('ctSlider').oninput = function(){
    window.__lastAdjust = Date.now();
    state.master.ct = Number(this.value);
    renderMaster();
    sendToAll({ brightness: state.master.brightness, ct: state.master.ct });
  };

  window.__preset = (brightness, ct) => {
    state.master.brightness = brightness;
    state.master.ct = ct;
    renderMaster();
    sendToAll({ power: true, brightness, ct });
  };

  // ---------- 꺼짐 타이머 (앱 자체 카운트다운 - 시간 되면 전체 소등) ----------
  let timerEndAt = null;
  let timerInterval = null;

  function fmtRemain(ms){
    const s = Math.max(0, Math.floor(ms/1000));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return (h>0 ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
  }

  function updateTimerDisplay(){
    if(!timerEndAt){ $('timerVal').textContent = '사용 안 함'; return; }
    $('timerVal').textContent = fmtRemain(timerEndAt - Date.now()) + ' 후 소등';
  }

  window.__setTimer = (min, btn) => {
    clearInterval(timerInterval);
    timerEndAt = Date.now() + min*60000;
    document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    $('timerCancelBtn').style.display = 'block';
    updateTimerDisplay();
    log(`[타이머] ${min}분 후 자동 소등 설정`);
    timerInterval = setInterval(()=>{
      if(!timerEndAt) return;
      if(timerEndAt - Date.now() <= 0){
        clearInterval(timerInterval); timerInterval = null; timerEndAt = null;
        document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
        $('timerCancelBtn').style.display = 'none';
        $('timerVal').textContent = '사용 안 함';
        log('[타이머] 시간 종료 - 전체 소등');
        allOff();
      } else {
        updateTimerDisplay();
      }
    }, 1000);
  };

  window.__cancelTimer = () => {
    clearInterval(timerInterval); timerInterval = null; timerEndAt = null;
    document.querySelectorAll('.timer-btn').forEach(b=>b.classList.remove('active'));
    $('timerCancelBtn').style.display = 'none';
    $('timerVal').textContent = '사용 안 함';
    log('[타이머] 취소됨');
  };

  function quickToggle(idx){
    const q = quickLights[idx];
    if(!q.connected){
      log(`[BLE] ${q.name}: 먼저 연결이 필요합니다 (아래 '전등별 블루투스 연결'에서 연결하세요)`);
      return;
    }
    const wasAnyOn = quickLights.some(l => l.power);
    q.power = !q.power;
    q.syncPending = q.power;
    const isAnyOn = quickLights.some(l => l.power);

    // 밝기/색온도는 보드가 종전 값으로 복원 → 응답(상태 알림)으로 슬라이더 반영
    renderMaster();
    renderQuick();
    if(typeof renderAllPowerBtn === 'function') renderAllPowerBtn();

    // MQTT
    if(state.client && state.connected){
      const payload = q.power
        ? JSON.stringify({ power:true, brightness:state.master.brightness, ct:state.master.ct })
        : JSON.stringify({ power:false });
      state.client.publish(`${state.topicBase}/${q.id}/set`, payload, {qos:1});
    }
    // BLE - 해당 전등의 개별 연결로만 전송
    bleSendTo(q.id, { power: q.power });   // 켜기/끄기만 전송 (밝기·색온도는 보드가 종전 값 유지)
  }

  function renderQuick(){
    $('quickGrid').innerHTML = quickLights.map((q,i)=>`
      <button class="quick-btn ${q.power?'on':''} ${q.connected?'':'offline'}" onclick="window.__quickToggle(${i})" style="position:relative;">
        <div class="quick-glyph">${bulbSvg(q.power)}</div>
        <span class="qname">${q.name}</span>
      </button>
    `).join('');
  }

  window.__quickToggle = quickToggle;
  renderQuick();

  function allOn(){
    const connected = quickLights.filter(q=>q.connected);
    connected.forEach(q => { q.power = true; q.syncPending = true; });
    renderMaster(); renderQuick(); renderAllPowerBtn();
    if(state.client && state.connected){
      const payload = JSON.stringify({ power:true });
      connected.forEach(q => state.client.publish(`${state.topicBase}/${q.id}/set`, payload, {qos:1}));
    }
    connected.forEach(q => bleSendTo(q.id, { power:true }));   // 밝기·색온도는 보드가 종전 값 유지
  }

  function allOff(){
    const connected = quickLights.filter(q=>q.connected);
    connected.forEach(q => q.power = false);

    // 간접등 UI만 리셋 (BLE 전송은 아래에서 한번에)
    indLevel = 0;
    const btn = $('indBtn');
    btn.classList.remove('lv1','lv2','lv3');
    $('indLabel').textContent = 'OFF';

    renderMaster(); renderQuick(); renderAllPowerBtn();

    const payload = { power:false };
    if(state.client && state.connected){
      connected.forEach(q => state.client.publish(`${state.topicBase}/${q.id}/set`, JSON.stringify(payload), {qos:1}));
    }
    connected.forEach(q => bleSendTo(q.id, payload));
  }
  function renderAllPowerBtn(){
    const isAnyOn = quickLights.some(l => l.power);
    $('allPowerBtn').classList.toggle('on', isAnyOn);
    $('allPowerLabel').textContent = isAnyOn ? '전체 끄기' : '전체 켜기';
    updateHero();
  }
  $('allPowerBtn').onclick = () => {
    const isAnyOn = quickLights.some(l => l.power);
    if (isAnyOn) allOff(); else allOn();
  };
  renderAllPowerBtn();

  // ---------- 간접등 3단계 토글 (OFF→L→M→H→OFF) ----------
  let indLevel = 0;
  const indLabels = ['간접등', 'L', 'M', 'H'];
  const indClasses = ['', 'lv1', 'lv2', 'lv3'];

  function setIndLevel(lv) {
    indLevel = lv;
    const btn = $('indBtn');
    btn.classList.remove('lv1','lv2','lv3');
    if (indClasses[lv]) btn.classList.add(indClasses[lv]);
    $('indLabel').textContent = lv === 0 ? 'OFF' : indLabels[lv];

    // 켜진 등에만 전송 (꺼진 등은 유지)
    const onLights = quickLights.filter(q => q.power && q.connected);
    if (onLights.length === 0) return;

    onLights.forEach(q => bleSendTo(q.id, { indLevel: lv }));
    if(state.client && state.connected){
      onLights.forEach(q => state.client.publish(
        `${state.topicBase}/${q.id}/set`, JSON.stringify({ indLevel: lv }), {qos:1}));
    }
  }

  $('indBtn').onclick = () => {
    setIndLevel((indLevel + 1) % 4);
  };

  // 초기 표시
  $('indLabel').textContent = 'OFF';

  // ---------- 블루투스 BLE GATT 통신 (전등 1대 = 보드 1대, 개별 연결) ----------
  const BLE_SERVICE      = '5f1a3a00-c1a2-4c0e-9c2e-9b3b6a1f0001';
  const BLE_CMD_CHAR     = '5f1a3a00-c1a2-4c0e-9c2e-9b3b6a1f0002'; // Write (앱→등)
  const BLE_STATE_CHAR   = '5f1a3a00-c1a2-4c0e-9c2e-9b3b6a1f0003'; // Notify (등→앱)

  // 전등 id별 연결 정보 (device/cmdChar/stateChar는 연결 시에만 채워짐)
  const bleLights = {
    L1: { device:null, cmdChar:null, stateChar:null, native:null },
    L2: { device:null, cmdChar:null, stateChar:null, native:null },
    L3: { device:null, cmdChar:null, stateChar:null, native:null },
    L4: { device:null, cmdChar:null, stateChar:null, native:null }
  };

  // 특정 전등에게만 JSON 명령 전송
  // 쓰기는 한 번에 하나씩만: 이전 쓰기가 끝나기 전에 온 명령은 하나로 합쳐(나중 값 우선) 다음에 전송
  // (다이얼/슬라이더를 빠르게 돌릴 때 'GATT operation already in progress'로 명령이 버려지던 문제 방지)
  async function bleSendTo(lightId, payload) {
    const b = bleLights[lightId];
    if (!b || !(b.cmdChar || b.native)) return;
    b.pending = Object.assign(b.pending || {}, payload);
    if (b.sending) return;
    b.sending = true;
    try {
      while (b.pending && (b.cmdChar || b.native)) {
        const out = b.pending; b.pending = null;
        try {
          if (b.native) await NativeBle.write(b.native, out);
          else await b.cmdChar.writeValueWithResponse(new TextEncoder().encode(JSON.stringify(out)));
        } catch(e) {
          log(`[BLE:${lightId}] 전송 오류: ` + e.message);
          await new Promise(res => setTimeout(res, 60));   // 잠깐 쉬고 최신 값으로 재시도하지 않고 다음 명령으로
        }
      }
    } finally { b.sending = false; }
  }

  // 특정 전등의 상태 알림 핸들러 생성 (전등 id를 클로저로 고정)
  // 보드가 보내오는 상태는 개별 전등의 on/off 여부만 반영하고,
  // 마스터 밝기/색온도 슬라이더는 사용자가 직접 조작했을 때만 갱신한다
  // (여러 보드가 각자 하트비트를 보내면서 서로 값이 살짝 어긋나 슬라이더가 흔들리는 문제 방지)
  function makeBleNotifyHandler(lightId){
    return function(event){
      try {
        const json = new TextDecoder().decode(event.target.value);
        const data = JSON.parse(json);
        log(`[BLE:${lightId}] 상태 수신: ` + json);
        const q = quickLights.find(x => x.id === lightId);
        const wasOn = q ? q.power : false;
        if (q && typeof data.power !== 'undefined') q.power = !!data.power;
        // 꺼짐→켜짐 전환(또는 연결 직후 켜져 있음)일 때만 슬라이더를 보드 값으로 동기화
        // (하트비트로는 갱신하지 않으므로 슬라이더가 흔들리지 않음)
        if (q && q.power && (!wasOn || q.syncPending) && data.brightness > 0 && Date.now() - (window.__lastAdjust||0) > 2000) {
          q.syncPending = false;
          state.master.brightness = data.brightness;
          if (typeof data.ct !== 'undefined') state.master.ct = data.ct;
          renderMaster();
        }
        renderQuick();
        renderDeviceList();
        renderAllPowerBtn();
      } catch(e) { log(`[BLE:${lightId}] 알림 파싱 오류: ` + e.message); }
    };
  }

  // GATT 연결 이후 공통 처리 (서비스/특성 구독, 상태 동기화)
  async function bleFinishConnect(lightId, device) {
    const b = bleLights[lightId];
    const q = quickLights.find(x => x.id === lightId);
    try {
      device.addEventListener('gattserverdisconnected', () => {
        b.device = null; b.cmdChar = null; b.stateChar = null;
        if (q) { q.connected = false; q.power = false; }
        log(`[BLE:${lightId}] 연결 끊김`);
        renderDeviceList(); renderQuick(); renderAllPowerBtn();
      });

      log(`[BLE:${lightId}] GATT 서버 연결 중...`);
      const server  = await device.gatt.connect();
      const service = await server.getPrimaryService(BLE_SERVICE);
      const cmdChar   = await service.getCharacteristic(BLE_CMD_CHAR);
      const stateChar = await service.getCharacteristic(BLE_STATE_CHAR);
      await stateChar.startNotifications();
      stateChar.addEventListener('characteristicvaluechanged', makeBleNotifyHandler(lightId));

      b.device = device; b.cmdChar = cmdChar; b.stateChar = stateChar;
      if (q) q.connected = true;
      log(`[BLE:${lightId}] ${device.name || '기기'} 연결 완료!`);

      // 연결 직후 실제 현재 상태를 읽어와서 앱 화면에 반영
      try {
        const value = await stateChar.readValue();
        makeBleNotifyHandler(lightId)({ target: { value } });
        log(`[BLE:${lightId}] 현재 상태 동기화 완료`);
      } catch(e) {
        log(`[BLE:${lightId}] 상태 읽기 실패: ` + e.message);
      }
      return true;
    } catch(e) {
      log(`[BLE:${lightId}] 연결 실패: ` + e.message);
      return false;
    } finally {
      renderDeviceList(); renderQuick(); renderAllPowerBtn();
    }
  }

  // 전등 목록 패널의 개별 '연결' 버튼용 - 정확히 그 전등 이름으로만 검색
  // (원하는 전등이 실제로 없으면 팝업이 못 찾은 채 남아있으니, 그때는 직접 취소해야 함)
  async function bleConnectLight(lightId) {
    if (NATIVE) { userDisc[lightId] = false; return nativeConnectAll(lightId); }
    if (!navigator.bluetooth) {
      log('[BLE] 이 브라우저는 Web Bluetooth를 지원하지 않습니다. Chrome(PC/안드로이드)을 사용해주세요.');
      return false;
    }
    try {
      log(`[BLE:${lightId}] 기기 검색 중... (이름: Narae-${lightId})`);
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'Narae-' + lightId }],
        optionalServices: [BLE_SERVICE]
      });
      return await bleFinishConnect(lightId, device);
    } catch(e) {
      log(`[BLE:${lightId}] 연결 실패: ` + e.message);
      return false;
    }
  }

  // 상단 '블루투스' 버튼 전용 - 정확한 전등 이름을 미리 지정하지 않고
  // 'Narae-'로 시작하는 아무 기기나 스캔 → 실제 눈앞에 있는 것만 목록에 뜸
  // → 선택된 기기 이름(Narae-L2 등)에서 전등 id를 알아내 연결
  // (L1이 실물로 없으면 애초에 목록에 안 뜨니, 다음 단계로 못 넘어가고 멈추는 문제가 없음)
  async function bleConnectAny() {
    if (!navigator.bluetooth) {
      log('[BLE] 이 브라우저는 Web Bluetooth를 지원하지 않습니다. Chrome(PC/안드로이드)을 사용해주세요.');
      return false;
    }
    let device;
    try {
      log('[BLE] 기기 검색 중... (Narae- 로 시작하는 전등)');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'Narae-' }],
        optionalServices: [BLE_SERVICE]
      });
    } catch(e) {
      log('[BLE] 연결 실패: ' + e.message);
      return false;
    }
    const lightId = (device.name || '').replace(/^Narae-/, '');
    if (!quickLights.find(x => x.id === lightId)) {
      log(`[BLE] '${device.name}': 알 수 없는 전등 이름이라 연결하지 않았습니다.`);
      return false;
    }
    return await bleFinishConnect(lightId, device);
  }

  // ================= 네이티브 앱(Capacitor) 전용 BLE =================
  // 선택창 없이 'Narae-' 전등을 이름으로 찾아 연결한다. 웹 브라우저에서는 사용하지 않는다.
  const NATIVE = !!(window.NativeBle && window.NativeBle.isNative);
  const userDisc = {};          // 사용자가 직접 연결 해제한 전등은 자동 재연결하지 않음
  let nativeBusy = false, retryTimer = null;

  async function nativeConnectOne(lightId, deviceId){
    const b = bleLights[lightId], q = quickLights.find(x => x.id === lightId);
    log(`[BLE:${lightId}] 연결 중...`);
    await NativeBle.connect(deviceId, () => {
      b.native = null;
      if (q) { q.connected = false; q.power = false; }
      log(`[BLE:${lightId}] 연결 끊김`);
      renderDeviceList(); renderQuick(); renderAllPowerBtn();
      if (!userDisc[lightId]) scheduleRetry();
    });
    b.native = deviceId;
    await NativeBle.notify(deviceId, value => makeBleNotifyHandler(lightId)({ target:{ value } }));
    if (q) q.connected = true;
    log(`[BLE:${lightId}] 연결 완료`);
    try { makeBleNotifyHandler(lightId)({ target:{ value: await NativeBle.readState(deviceId) } }); } catch(e) { log(`[BLE:${lightId}] 상태 읽기 실패: ` + e.message); }
    renderDeviceList(); renderQuick(); renderAllPowerBtn();
  }

  // 주변 전등을 검색해 아직 연결 안 된 것만 연결 (onlyId 가 있으면 그 전등만)
  async function nativeConnectAll(onlyId){
    if (nativeBusy) return;
    nativeBusy = true;
    try {
      autoStatus('전등 검색 중...');
      let found;
      try { found = await NativeBle.scan(4000); }
      catch(e) { autoStatus('블루투스 권한 또는 설정을 확인하세요 · ' + e.message); log('[BLE] 검색 실패: ' + e.message); return; }
      const targets = found.filter(f => {
        const id = f.name.replace(/^Narae-/, '');
        return quickLights.some(q => q.id === id) && !bleLights[id].native && (!onlyId || id === onlyId);
      });
      if (!targets.length) { autoStatus(found.length ? '' : '주변에서 전등을 찾지 못했습니다'); setTimeout(() => autoStatus(''), 4000); return; }
      let ok = 0;
      for (let i = 0; i < targets.length; i++) {
        const t = targets[i], id = t.name.replace(/^Narae-/, '');
        autoStatus(`연결 중 ${i+1}/${targets.length} · ${t.name}`);
        userDisc[id] = false;
        try { await nativeConnectOne(id, t.deviceId); ok++; }
        catch(e) { log(`[BLE:${id}] 연결 실패: ` + e.message); }
      }
      autoStatus(ok === targets.length ? '' : `${ok}/${targets.length}대 연결됨`);
    } finally { nativeBusy = false; }
  }

  // 연결이 끊긴 전등(보드 전원 재투입 등)을 잠시 뒤 다시 찾아 연결
  function scheduleRetry(){
    if (retryTimer) return;
    retryTimer = setTimeout(() => { retryTimer = null; nativeConnectAll(); }, 5000);
  }

  function bleDisconnectLight(lightId) {
    const b = bleLights[lightId];
    const q = quickLights.find(x => x.id === lightId);
    if (b.native) { userDisc[lightId] = true; NativeBle.disconnect(b.native); b.native = null; }
    if (b.device && b.device.gatt.connected) b.device.gatt.disconnect();
    b.device = null; b.cmdChar = null; b.stateChar = null;
    if (q) { q.connected = false; q.power = false; }
    log(`[BLE:${lightId}] 연결 해제`);
    renderDeviceList(); renderQuick(); renderAllPowerBtn();
  }

  function renderBleSummary(){
    const n = quickLights.filter(q=>q.connected).length;
    $('bleBtn').classList.toggle('on', n > 0);
    $('bleLabel').textContent = n > 0 ? `${n}/4 연결됨` : '블루투스';
  }

  function renderDeviceList(){
    $('deviceList').innerHTML = quickLights.map(q => `
      <div class="follow-row">
        <div class="follow-left">
          <div class="follow-bulb ${q.connected ? 'ble-on':''}">${bleSvg()}</div>
          <div class="follow-name">
            <div class="name">${q.name} <span style="color:var(--ink-soft);font-weight:400;">(Narae-${q.id})</span></div>
            <div class="meta"><span class="dot ${q.connected?'on':''}"></span>${q.connected ? 'BLE 연결됨' : '연결 안 됨'}</div>
          </div>
        </div>
        <div class="follow-right">
          <button class="ble-action-btn ${q.connected ? 'disconnect':'connect'}" onclick="window.__toggleBleLight('${q.id}')">${q.connected ? '연결 해제' : '연결'}</button>
        </div>
      </div>
    `).join('');
    renderBleSummary();
  }

  window.__toggleBleLight = (id) => {
    const q = quickLights.find(x => x.id === id);
    if (q && q.connected) bleDisconnectLight(id);
    else bleConnectLight(id);
  };

  // 상단 블루투스 버튼: 한 번 누르면 미연결 전등 수만큼 'Narae-' 스캔을 이어서 띄움
  // (L1이 실물로 없으면 목록에 아예 안 뜨니, L2/L3만 있어도 그대로 골라 연결 가능)
  // 다 연결되어 있으면 전체 연결 해제로 동작
  $('bleBtn').onclick = async () => {
    if (NATIVE) {
      if (quickLights.some(q => !q.connected)) nativeConnectAll();
      else quickLights.forEach(q => { if (q.connected) bleDisconnectLight(q.id); });
      return;
    }
    const pendingCount = quickLights.filter(q => !q.connected).length;
    if (pendingCount > 0) {
      for (let i = 0; i < pendingCount; i++) {
        const ok = await bleConnectAny();
        if (!ok) break; // 사용자가 팝업을 취소하면 중단
      }
    } else {
      quickLights.forEach(q => { if (q.connected) bleDisconnectLight(q.id); });
    }
  };

  // ---------- 앱 시작 시 이전에 허용한 전등 자동 재연결 ----------
  // 크롬이 지원하면(navigator.bluetooth.getDevices) 선택창 없이 L1~L4를 다시 연결한다.
  // 지원하지 않거나 보드가 범위 밖이면 조용히 건너뛰고, 기존처럼 블루투스 버튼으로 연결한다.
  let autoBusy = false, autoLastAt = 0;
  function autoStatus(t){ const e = $('autoStatus'); if (e) e.textContent = t || ''; }
  function withTimeout(promise, ms, msg){
    return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
  }
  async function bleAutoReconnect(){
    if (NATIVE) { nativeConnectAll(); return; }
    if (autoBusy) return;
    if (!navigator.bluetooth) { autoStatus('이 브라우저는 블루투스를 지원하지 않습니다'); return; }
    if (!navigator.bluetooth.getDevices) { autoStatus('자동 재연결 미지원 · 블루투스 버튼으로 연결하세요'); return; }
    if (Date.now() - autoLastAt < 5000) return;
    autoBusy = true; autoLastAt = Date.now();
    try {
      const devices = await navigator.bluetooth.getDevices();
      log(`[BLE] 이전에 허용한 기기 ${devices.length}대`);
      const targets = devices.filter(d => {
        const id = (d.name || '').replace(/^Narae-/, '');
        return /^Narae-/.test(d.name || '') && quickLights.some(q => q.id === id) && !(bleLights[id] && bleLights[id].device && bleLights[id].device.gatt.connected);
      });
      if (!targets.length) {
        if (!devices.length) autoStatus('저장된 연결 없음 · 블루투스 버튼으로 한 번 연결하세요');
        else autoStatus('');
        return;
      }
      let ok = 0;
      for (let i = 0; i < targets.length; i++) {
        const d = targets[i], id = d.name.replace(/^Narae-/, '');
        autoStatus(`자동 재연결 중 ${i+1}/${targets.length} · ${d.name}`);
        try {
          // 광고 확인은 참고만 (안드로이드에서는 신호가 안 와도 직접 연결이 되는 경우가 있어 건너뛰지 않음)
          if (d.watchAdvertisements) {
            const ac = new AbortController();
            await new Promise(resolve => {
              const t = setTimeout(resolve, 2500);
              d.addEventListener('advertisementreceived', () => { clearTimeout(t); resolve(); }, { once:true });
              d.watchAdvertisements({ signal: ac.signal }).catch(() => { clearTimeout(t); resolve(); });
            });
            ac.abort();
          }
          const done = await withTimeout(bleFinishConnect(id, d), 15000, '연결 시간 초과');
          if (done) ok++;
        } catch(e) { log(`[BLE:${id}] 자동 연결 실패: ` + e.message); }
      }
      autoStatus(ok === targets.length ? '' : `자동 재연결 ${ok}/${targets.length}대 · 나머지는 블루투스 버튼으로 연결하세요`);
      if (ok === targets.length) autoStatus('');
    } catch(e) {
      log('[BLE] 자동 재연결 오류: ' + e.message);
      autoStatus('자동 재연결 오류 · ' + e.message);
    } finally { autoBusy = false; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') bleAutoReconnect(); });
  setTimeout(bleAutoReconnect, 400);

  renderDeviceList();
  renderMaster();
})();
</script>
<script>
// 다이얼 링 드래그 → 밝기 슬라이더(숨김)에 반영
(function(){
  const svg = document.getElementById('dialSvg'), sl = document.getElementById('brightSlider');
  if (!svg || !sl) return;
  let drag = false;
  function setFrom(e){
    const r = svg.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
    let rel = ((a - 135) % 360 + 360) % 360;
    if (rel > 270) rel = rel > 315 ? 0 : 270;
    const v = Math.max(5, Math.min(100, Math.round(rel / 270 * 100)));
    if (Number(sl.value) !== v) { sl.value = v; sl.dispatchEvent(new Event('input')); }
  }
  svg.addEventListener('pointerdown', e => {
    const r = svg.getBoundingClientRect(), d = Math.hypot(e.clientX - (r.left+r.width/2), e.clientY - (r.top+r.height/2));
    if (d < r.width * 0.34) return;   // 중앙 전원 버튼 영역은 제외
    drag = true; svg.setPointerCapture(e.pointerId); setFrom(e);
  });
  svg.addEventListener('pointermove', e => { if (drag) setFrom(e); });
  const end = () => { drag = false; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
})();
</script>
